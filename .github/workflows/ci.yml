name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pipeline:
    name: lint, warehouse, model, tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            constraints.txt

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install
        run: make setup PYTHON=python

      - name: Lint
        run: make lint

      # No data is generated here. The committed 150-patient sample goes through the same
      # dbt project and the same model code as the full data, in fast mode.
      - name: Warehouse and model pipeline on the sample
        run: make sample

      - name: Tests
        run: .venv/bin/python -m pytest -q

      - name: Browser scorer matches Python
        run: make parity

      - name: README and model card numbers match the reports
        run: .venv/bin/python scripts/update_readme_metrics.py --check

  docker:
    name: API image
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Build
        run: docker build -f api/Dockerfile -t rising-risk-api .

      - name: Start the container and wait for its health check
        run: |
          docker run -d --name api -p 8000:8000 rising-risk-api
          for i in $(seq 1 60); do
            status=$(docker inspect --format '{{.State.Health.Status}}' api)
            [ "$status" = "healthy" ] && break
            sleep 2
          done
          docker logs api
          [ "$status" = "healthy" ]

      - name: Score one member
        run: |
          curl --fail --silent --show-error localhost:8000/v1/score \
            -H 'content-type: application/json' \
            -d '{"age": 67, "sex_female": 0, "cost_prior_12m": 4200, "has_diabetes": 1}' \
            | tee /dev/stderr | grep -q '"tier"'
